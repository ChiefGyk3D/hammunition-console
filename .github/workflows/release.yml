# Cut a release when a v* tag is pushed, through artifact-release.yml in
# ChiefGyk3D/git-your-ship-together (GYST, v1.6.3). The build produces
# hammunition-console-<version>.tar.gz from `git archive` with the prefix
# hammunition-console-<version>/ (the layout of GitHub's own tag archive, which the
# Hammunition catalog unit pins); GYST adds SHA256SUMS, a cosign bundle and SLSA
# provenance per file and attaches them to the release. The verify step refuses a tag that
# disagrees with the tree, then unpacks the archive and runs install.sh into a temporary
# prefix and the wrapper's --version. A pull request builds and verifies and never
# publishes. The version reaches shell only as $VERSION, set by the workflow.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifacts:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/artifact-release.yml@0e58a0e61ea8b3800d1cb0e6ed81bb860ace2094 # v1.6.3
    permissions:
      contents: write       # the GitHub release and its assets
      id-token: write       # keyless signing and build provenance
      attestations: write   # the provenance record
    with:
      publish: ${{ startsWith(github.ref, 'refs/tags/v') }}
      tag-prefix: v
      build-command: |
        mkdir -p dist
        git archive --format=tar.gz --prefix="hammunition-console-${VERSION}/" \
          -o "dist/hammunition-console-${VERSION}.tar.gz" HEAD
      artifacts: dist/hammunition-console-*.tar.gz
      verify-command: |
        case "$VERSION" in
          0.0.0+*) echo "not a tag: the tag/tree check is skipped" ;;
          *) python3 scripts/check_version.py "v$VERSION" ;;
        esac
        work="$(mktemp -d)"
        python3 -m venv "$work/venv"
        "$work/venv/bin/pip" install --quiet "urwid==3.0.4"
        tar -xzf "dist/hammunition-console-${VERSION}.tar.gz" -C "$work"
        cd "$work/hammunition-console-${VERSION}"
        ./install.sh --prefix "$work/prefix" --interpreter "$work/venv/bin/python"
        "$work/prefix/bin/hammunition-console" --version
      release-notes-command: |
        case "$VERSION" in
          0.0.0+*) exit 0 ;;
        esac
        notes="$(awk -v v="v${VERSION}" 'index($0, "## " v " ") == 1 {f=1; next} /^## / {f=0} f' CHANGELOG.md)"
        test -n "$notes"
        printf '%s\n' "$notes"
      egress-policy: block
      extra-allowed-endpoints: pypi.org:443 files.pythonhosted.org:443
