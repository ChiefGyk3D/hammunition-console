# CI for hammunition-console. The tests run on the oldest Python the console supports
# and the newest, against the oldest urwid it supports (2.6.10, Ubuntu 24.04's), the
# one Debian 13 and Parrot ship (2.6.16) and the newest (3.0.4, Ubuntu 26.04 and
# Kali's); and against each archive's own python3-urwid, which is what the console
# depends on in the field. The archive jobs also install from `git archive` output
# (what a tag archive holds) as an unprivileged user into a home prefix and run the
# installed wrapper's --version; no engine is ever run. Actions are pinned by commit,
# resolved with `git ls-remote --tags` on 2026-10-03; a tag reaches shell only
# through env.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fragments:
    name: a changelog fragment for a code change
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the range needs a fragment when it changes the package
        env:
          BASE: ${{ github.base_ref }}
        run: python3 scripts/changelog.py check-pr --base "origin/$BASE"

  lint:
    name: ruff, mypy --strict, headers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install ruff mypy pytest "urwid==3.0.4"
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python scripts/spdx.py --check

  test:
    name: tests (Python ${{ matrix.python }}, urwid ${{ matrix.urwid }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.11", urwid: "2.6.10"}
          - {python: "3.13", urwid: "2.6.16"}
          - {python: "3.13", urwid: "3.0.4"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest "urwid==${{ matrix.urwid }}"
      - run: python -m pytest -v

  archive-ubuntu:
    name: tests and archive install (Ubuntu 24.04 archive urwid, system python3)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-urwid python3-pytest
      - run: /usr/bin/python3 -c "import urwid; print('urwid', urwid.__version__)"
      - run: /usr/bin/python3 -m pytest -v
      - name: install from a git archive as this unprivileged user into a home prefix
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          ver="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' hammunition_console/__init__.py)"
          git archive --format=tar.gz --prefix="hammunition-console-${ver}/" HEAD > "$work/a.tar.gz"
          tar -xzf "$work/a.tar.gz" -C "$work"
          (cd "$work/hammunition-console-${ver}" && ./install.sh --prefix "$work/prefix")
          "$work/prefix/bin/hammunition-console" --version

  archive-debian:
    name: tests and archive install (Debian 13 archive urwid, system python3)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: debian:trixie
    steps:
      - run: apt-get update -qq && apt-get install -y -qq python3-urwid python3-pytest git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -c "import urwid; print('urwid', urwid.__version__)"
      - run: python3 -m pytest -v
      - name: install from a git archive as an unprivileged user into a home prefix
        run: |
          set -eu
          git config --global --add safe.directory "$PWD"
          useradd --create-home tester
          ver="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' hammunition_console/__init__.py)"
          git archive --format=tar.gz --prefix="hammunition-console-${ver}/" HEAD > /tmp/a.tar.gz
          tar -xzf /tmp/a.tar.gz -C /home/tester
          chown -R tester: "/home/tester/hammunition-console-${ver}"
          runuser -u tester -- sh -c 'cd /home/tester/hammunition-console-* && ./install.sh --prefix /home/tester/prefix && /home/tester/prefix/bin/hammunition-console --version'

  shell:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: shellcheck install.sh uninstall.sh bin/hammunition-console
