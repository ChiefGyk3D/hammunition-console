# CI for hammunition-console, through the reusable workflows in
# ChiefGyk3D/git-your-ship-together (GYST, v1.6.3). GYST runs ruff, mypy --strict, the
# pytest matrix and shellcheck, and each of its two callers ends in a `CI green` job
# (`ci / CI green`, `shell / CI green`). What stays in this file is what a shared workflow
# cannot do: the two proofs that install.sh works against an archive's own python3-urwid
# as an unprivileged user (Debian and Ubuntu containers), the urwid 2.6.16 leg (python-ci's
# matrix varies Python only), and the changelog-fragment check. `local jobs green` is
# their gate. No Doppler: nothing here needs a secret. The pin is the commit the v1.6.3
# tag peels to, not the annotated tag object.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ruff, mypy --strict and the pytest matrix. Python 3.11 runs against the oldest urwid
  # the console supports (2.6.10, Ubuntu 24.04's) and 3.13 against the newest (3.0.4,
  # Ubuntu 26.04's and Kali's); 2.6.16 (Debian 13, Parrot) is the local `urwid` job below.
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-ci.yml@0e58a0e61ea8b3800d1cb0e6ed81bb860ace2094 # v1.6.3
    permissions:
      contents: read
    with:
      python-versions: '["3.11", "3.13"]'
      install-command: |
        python -m pip install --upgrade pip pytest
        if python -c 'import sys; sys.exit(sys.version_info >= (3, 12))'; then
          pip install "urwid==2.6.10"
        else
          pip install "urwid==3.0.4"
        fi
      test-command: python -m pytest -v
      lint-install-command: python -m pip install ruff pytest "urwid==3.0.4"
      lint-command: |
        python -m ruff check .
        python scripts/spdx.py --check
      typecheck-install-command: python -m pip install mypy pytest "urwid==3.0.4"
      typecheck-command: python -m mypy
      docker-build: false
      egress-policy: block

  # shellcheck over the three shell files (shfmt is off: the scripts are hand-formatted
  # and this project does not reflow files for no defect found).
  shell:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/bash-ci.yml@0e58a0e61ea8b3800d1cb0e6ed81bb860ace2094 # v1.6.3
    permissions:
      contents: read
    with:
      paths: install.sh uninstall.sh bin/hammunition-console
      shfmt: false
      workflow-lint: false   # python-ci lints the workflow files
      egress-policy: block

  fragments:
    name: a changelog fragment for a code change
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the range needs a fragment when it changes the package
        env:
          BASE: ${{ github.base_ref }}
        run: python3 scripts/changelog.py check-pr --base "origin/$BASE"

  urwid:
    name: tests (Python 3.13, urwid 2.6.16)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install pytest "urwid==2.6.16"
      - run: python -m pytest -v

  archive-ubuntu:
    name: tests and archive install (Ubuntu 24.04 archive urwid, system python3)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-urwid python3-pytest
      - run: /usr/bin/python3 -c "import urwid; print('urwid', urwid.__version__)"
      - run: /usr/bin/python3 -m pytest -v
      - name: install from a git archive as this unprivileged user into a home prefix
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          ver="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' hammunition_console/__init__.py)"
          git archive --format=tar.gz --prefix="hammunition-console-${ver}/" HEAD > "$work/a.tar.gz"
          tar -xzf "$work/a.tar.gz" -C "$work"
          (cd "$work/hammunition-console-${ver}" && ./install.sh --prefix "$work/prefix")
          "$work/prefix/bin/hammunition-console" --version

  archive-debian:
    name: tests and archive install (Debian 13 archive urwid, system python3)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: debian:trixie
    steps:
      - run: apt-get update -qq && apt-get install -y -qq python3-urwid python3-pytest git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -c "import urwid; print('urwid', urwid.__version__)"
      - name: create the unprivileged user the tests and the install run as
        run: useradd --create-home tester
      - name: tests, as that user (install.sh and the console refuse to run as root)
        run: |
          set -eu
          cp -a "$PWD" /home/tester/src
          chown -R tester: /home/tester/src
          runuser -u tester -- env HOME=/home/tester sh -c 'cd /home/tester/src && python3 -m pytest -v'
      - name: install from a git archive as an unprivileged user into a home prefix
        run: |
          set -eu
          git config --global --add safe.directory "$PWD"
          ver="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' hammunition_console/__init__.py)"
          git archive --format=tar.gz --prefix="hammunition-console-${ver}/" HEAD > /tmp/a.tar.gz
          tar -xzf /tmp/a.tar.gz -C /home/tester
          chown -R tester: "/home/tester/hammunition-console-${ver}"
          runuser -u tester -- sh -c 'cd /home/tester/hammunition-console-* && ./install.sh --prefix /home/tester/prefix && /home/tester/prefix/bin/hammunition-console --version'

  local:
    name: local jobs green
    if: always()
    needs: [fragments, urwid, archive-ubuntu, archive-debian]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every local job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
